# ==============================================================================
# CONFIGURACIÓN TRADINGVIEW DISCORD RICH PRESENCE (RPC)
# ==============================================================================
# Archivo de configuración principal (formato INI / .cfg).
# Puedes editar los valores directamente en este archivo.
# Los cambios tendrán efecto al reiniciar el programa o ejecutable.

[Discord]
# Tu Application ID / Client ID creado en Discord Developer Portal:
# https://discord.com/developers/applications (Nombra tu aplicación "TradingView")
client_id = 1170029929543520326

# Frecuencia de verificación en segundos (recomendado: 2.0 a 5.0)
detection_interval = 3.0

[Display]
# Formato de la primera línea en Discord (details)
# Variables disponibles: {symbol}, {raw_symbol}, {exchange}, {timeframe}, {price}, {change}
details_format = Analizando {symbol}

# Formato de la segunda línea en Discord (state)
# Variables disponibles: {symbol}, {raw_symbol}, {exchange}, {timeframe}, {price}, {change}
state_format = {timeframe} • {exchange}

# Opciones de visualización (true / false)
show_exchange = true
show_timeframe = true
show_price = false
show_timestamp = true

# Iconos automáticos de alta definición por activo (Forex, Cripto, Acciones, Materias Primas)
# Si es true: muestra la bandera o logo del par (ej: Japón para USD/JPY, Bitcoin para BTC, etc.)
# Si es false: usa siempre large_image_key (el logo general de TradingView)
custom_asset_icons = true

# Comportamiento cuando TradingView no está activo o está cerrado:
# - 'idle': Muestra un estado en reposo en Discord (ej: "En TradingView • Explorando mercados")
# - 'clear': Oculta por completo el Rich Presence de Discord
inactive_behavior = idle

[Assets]
# Imagen principal de fallback (logotipo oficial de TradingView en alta resolución)
large_image_key = https://s3.tradingview.com/userpics/6171439-mFQX_big.png
large_text = TradingView

# Imagen secundaria pequeña (opcional - por defecto TradingView badge en la esquina inferior)
small_image_key = 
small_text = TradingView

[General]
# Nivel de logging en consola: INFO, DEBUG, WARNING, ERROR
log_level = INFO
